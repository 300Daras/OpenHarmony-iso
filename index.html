<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cordex OS Gelişmiş Dağıtım</title>
    <style>
        body {
            background: linear-gradient(rgba(13, 17, 23, 0.85), rgba(13, 17, 23, 0.85)), 
                        url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1920') no-repeat center center fixed;
            background-size: cover;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            border: 3px solid #00ffcc;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
            background-color: rgba(22, 27, 34, 0.95);
            padding: 50px;
            border-radius: 16px;
            width: 680px; 
            min-height: 480px;
            text-align: center;
            box-sizing: border-box;
            backdrop-filter: blur(8px);
        }

        h1 {
            color: #00ffcc;
            font-size: 32px;
            margin-bottom: 30px;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        h2 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="password"], input[type="text"], textarea {
            width: 100%;
            padding: 15px;
            background-color: #0d1117;
            border: 2px solid #30363d;
            border-radius: 8px;
            color: #fff;
            font-size: 17px;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            border-color: #00ffcc;
            outline: none;
            box-shadow: 0 0 10px #00ffcc;
        }

        button {
            background-color: #00ffcc;
            color: #0d1117;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            transition: 0.3s;
            width: 100%;
        }

        button:hover {
            background-color: #00cc99;
            box-shadow: 0 0 25px #00cc99;
            transform: translateY(-2px);
        }

        .dev-btn-style {
            background-color: transparent;
            color: #ff9900;
            border: 2px solid #ff9900;
            margin-top: 20px;
            box-shadow: 0 0 10px rgba(255, 153, 0, 0.2);
        }

        .dev-btn-style:hover {
            background-color: #ff9900;
            color: #0d1117;
            box-shadow: 0 0 20px #ff9900;
        }

        .dev-login-box {
            display: none;
            margin-top: 15px;
            border-top: 2px dashed #ff9900;
            padding-top: 25px;
        }

        .panel-screen {
            display: none;
            text-align: left;
        }

        .progress-container {
            background-color: #0d1117;
            border-radius: 8px;
            border: 1px solid #30363d;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar {
            background-color: #00ffcc;
            height: 25px;
            width: 45%; 
            text-align: center;
            line-height: 25px;
            color: #0d1117;
            font-weight: bold;
            transition: width 0.4s ease;
            box-shadow: 0 0 10px #00ffcc;
        }

        .readonly-notes {
            background-color: #0d1117;
            border: 2px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            min-height: 100px;
            white-space: pre-wrap;
            font-family: monospace;
            color: #fff;
        }
