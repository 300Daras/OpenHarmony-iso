<script>
        /* ==========================================================================
           0. KÜRESEL GÜVENLİK ANAHTARLARI (GELİŞMİŞ ŞİFRELEME MATRİSİ)
           ========================================================================== */
        const MASTER_PIN = "20268"; // ANA GİRİŞ KAPISI PİNİ
        const LOCKDOWN_BYPASS_KEY = "20268"; // SON EMİRİ KIRMAK İÇİN ŞİFRE
        const ISO_BUILD_KEY = "racoon_iso_2026"; // ISO DERLEME ŞİFRESİ
        
        // KATMAN (LEVEL) ŞİFRELERİ
        const LEVEL_AUTH_VAULT = {
            "lvl1": "", // Konuk
            "lvl2": "operator_22",
            "lvl3": "dev_core_33",
            "lvl4": "admin_sys_44",
            "lvl5": "architect_55",
            "lvl6": "ghost_protocol_66",
            "lvl7": "nebula_override_77",
            "lvl8": "nambow_god_mode_88",
            "lvl99": "override_cowboy_plus_99" // COWBOY+ GİZLİ ŞİFRESİ
        };

        // KÜRESEL DURUM DEĞİŞKENLERİ
        let currentLevel = "lvl1";
        let isNambowActive = false;
        let isCowboyPlusActive = false;
        let isLockdownActive = false;
        let bypassTimerActive = false;

        // OP ÖZELLİK DURUMLARI
        let opStates = {
            aegis: false,
            chronos: false,
            ghost: false,
            hyper: false,
            vortex: false
        };

        /* ==========================================================================
           1. KALICI KİLİT (PERSISTENT LOCKDOWN) - SON EMİR PROTOKOLÜ
           ========================================================================== */
        window.onload = function() {
            let checkLockdown = localStorage.getItem("racoon_son_emir_lock");
            
            if (checkLockdown === "ACTIVE") {
                // SİSTEM YOK EDİLMİŞ! Doğrudan Kilit Ekranını Aç.
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("main-container").style.display = "none";
                document.getElementById("persistent-lockdown-screen").style.display = "flex";
                startLockdownSequence();
            } else {
                document.getElementById("pin1").focus();
            }
        };

        function startLockdownSequence() {
            isLockdownActive = true;
            let timerDisplay = document.getElementById("lockdown-timer-display");
            let inputField = document.getElementById("lockdown-bypass-input");
            
            inputField.disabled = true;
            inputField.placeholder = "SİSTEM MÜHÜRLÜ - BEKLEYİN...";
            
            let timeLeft = 60; // 60 Saniye bekleme süresi
            
            let countdown = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = `00:${timeLeft < 10 ? '0'+timeLeft : timeLeft}`;
                
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timerDisplay.innerText = "GİRİŞ BEKLENİYOR";
                    inputField.disabled = false;
                    inputField.placeholder = "BYPASS ŞİFRESİNİ GİRİN";
                    inputField.focus();
                    bypassTimerActive = true;
                }
            }, 1000);
        }

        function attemptLockdownBypass() {
            if (!bypassTimerActive) return;
            let bypassInput = document.getElementById("lockdown-bypass-input").value;
            let errorMsg = document.getElementById("lockdown-error");

            if (bypassInput === LOCKDOWN_BYPASS_KEY) {
                errorMsg.style.display = "none";
                document.getElementById("persistent-lockdown-screen").style.display = "none";
                startCowboyAutoRepair();
            } else {
                errorMsg.style.display = "block";
                document.getElementById("lockdown-bypass-input").value = "";
                setTimeout(() => { errorMsg.style.display = "none"; }, 2000);
            }
        }

        function startCowboyAutoRepair() {
            let repairScreen = document.getElementById("cowboy-repair-screen");
            repairScreen.style.display = "flex";
            
            let repairBar = document.getElementById("repair-fill-bar");
            let repairLog = document.getElementById("repair-log");
            
            let progress = 0;
            let repairInterval = setInterval(() => {
                progress += 5; 
                repairBar.style.width = progress + "%";
                repairLog.innerText = `Veri blokları onarılıyor: %${progress} \n[VFS_KERNEL_RESTORE_0x${Math.floor(Math.random()*9999)}]`;
                
                if (progress >= 100) {
                    clearInterval(repairInterval);
                    repairLog.innerText = "SİSTEM BAŞARIYLA ONARILDI. YENİDEN BAŞLATILIYOR...";
                    localStorage.removeItem("racoon_son_emir_lock");
                    setTimeout(() => { window.location.reload(); }, 2000);
                }
            }, 1000);
        }

        /* ==========================================================================
           2. 5-PIN GİRİŞ SİSTEMİ MOTORU
           ========================================================================== */
        function moveToNext(currentElement, nextElementId) {
            if (currentElement.value.length >= currentElement.maxLength) {
                if (nextElementId) document.getElementById(nextElementId).focus();
            }
        }

        function checkFullPin() {
            let pin1 = document.getElementById("pin1").value;
            let pin2 = document.getElementById("pin2").value;
            let pin3 = document.getElementById("pin3").value;
            let pin4 = document.getElementById("pin4").value;
            let pin5 = document.getElementById("pin5").value;
            let enteredPin = pin1 + pin2 + pin3 + pin4 + pin5;

            if (enteredPin.length === 5) {
                if (enteredPin === MASTER_PIN) {
                    document.getElementById("login-screen").style.display = "none";
                    document.getElementById("main-container").style.display = "flex";
                    logTerm("Sistem Ana Girişi Başarılı. Z1 Extreme Mimarisi Senkronize.", "success");
                    startTelemetryStream();
                } else {
                    let errorMsg = document.getElementById("pin-error");
                    errorMsg.style.display = "block";
                    document.getElementById("pin1").value = "";
                    document.getElementById("pin2").value = "";
                    document.getElementById("pin3").value = "";
                    document.getElementById("pin4").value = "";
                    document.getElementById("pin5").value = "";
                    document.getElementById("pin1").focus();
                    setTimeout(() => { errorMsg.style.display = "none"; }, 2000);
                }
            }
        }

        /* ==========================================================================
           3. DEVASA SANAL DOSYA SİSTEMİ (VFS - 450+ SATIR HACMİ İÇİN DUMP)
           ========================================================================== */
        const virtualFileSystem = [
            "/boot/grub/grub.cfg", "/boot/kernel/z1_extreme_v12.ko",
            "/etc/racoon/system.conf", "/etc/cowboy/override.rules",
            "/var/log/nambow_matrix.log", "/var/log/aegis_firewall.log",
            "/usr/bin/complex_diagnostic", "/usr/bin/cowboy_plus_engine",
            "/sys/class/thermal/cooling_device0/type"
        ];
        for(let i = 0; i < 1500; i++) {
            let hash = Math.random().toString(36).substring(2, 10);
            virtualFileSystem.push(`/var/lib/docker/overlay2/${hash}/diff/usr/bin/sys_cache_${i}.dll`);
        }
        for(let j = 0; j < 500; j++) {
            virtualFileSystem.push(`/opt/aegis/quantum_blocks/block_0x00${j}F.dat`);
        }

        /* ==========================================================================
           4. HİYERARŞİ VE ŞİFRE DOĞRULAMA (LEVEL YÖNETİMİ)
           ========================================================================== */
        function handleLevelSelectChange(val) {
            if (val === "lvl8" || val === "lvl99") {
                let uyar = confirm("KRİTİK UYARI: Yüksek yetki katmanına geçiş yapıyorsunuz. İzinsiz girişler Aegis tarafından engellenecektir. Devam edilsin mi?");
                if (!uyar) {
                    document.getElementById("user-level-selector").value = currentLevel;
                    logTerm("Yüksek yetki geçişi kullanıcı tarafından iptal edildi.", "warning");
                    return;
                }
            }

            if (val !== "lvl1") {
                let attempt = prompt(`[GÜVENLİK PROTOKOLÜ] ${val.toUpperCase()} katmanı için erişim şifresini girin:`);
                if (attempt !== LEVEL_AUTH_VAULT[val]) {
                    alert("❌ ERİŞİM REDDEDİLDİ! Geçersiz Şifre.");
                    logTerm(`İzinsiz ${val.toUpperCase()} geçiş denemesi. İşlem engellendi.`, "error");
                    document.getElementById("user-level-selector").value = currentLevel;
                    return;
                }
            }
            logTerm(`Yetki Doğrulandı. Aktif Katman: ${val.toUpperCase()}`, "success");
            switchLevel(val);
        }

        function switchLevel(lvl) {
            currentLevel = lvl;
            document.getElementById("terminal-prompt").innerText = `${lvl}@racoon:~$`;

            document.getElementById("nambow-master-panel").style.display = "none";
            document.getElementById("cowboy-panel").style.display = "none";
            document.getElementById("complex-panel").style.display = "none";
            document.getElementById("cowboy-plus-panel").style.display = "none";
            
            document.body.classList.remove("nambow-active", "cowboy-active", "complex-active");

            if (lvl === "lvl8") {
                document.getElementById("nambow-master-panel").style.display = "block";
                document.body.classList.add("nambow-active");
                document.getElementById("terminal-prompt").style.color = "var(--nambow-purple)";
                logTerm("NAMBOW MATRİSİ AKTİF. Alt modüllerin kilidi açıldı.", "nambow");
                document.getElementById("cowboy-plus-option").style.display = "block";
            } 
            else if (lvl === "lvl99") {
                document.getElementById("cowboy-plus-panel").style.display = "block";
                document.getElementById("terminal-prompt").style.color = "var(--cowboy-plus-crimson)";
                logTerm("🔥 COWBOY+ OVERRIDE AKTİF. SİSTEM KONTROLÜ %100 ELE GEÇİRİLDİ.", "error");
            }
            else {
                document.getElementById("terminal-prompt").style.color = "var(--primary-orange)";
            }
        }

        /* ==========================================================================
           5. NAMBOW İÇİNDEN AÇILAN ALT MODÜLLER (COMPLEX & COWBOY)
           ========================================================================== */
        function unlockComplexLayer() {
            document.getElementById("complex-panel").style.display = "block";
            document.getElementById("complex-panel").classList.add("complex-active");
            logTerm("COMPLEX Yönetim Modülü Başlatıldı.", "complex");
        }

        function unlockCowboyLayer() {
            document.getElementById("cowboy-panel").style.display = "block";
            document.getElementById("cowboy-panel").classList.add("cowboy-active");
            logTerm("COWBOY Standart Komuta Paneli Çevrimiçi.", "cowboy");
        }

        function unlockCowboyPlusLayer() {
            document.getElementById("user-level-selector").value = "lvl99";
            handleLevelSelectChange("lvl99");
        }

        /* ==========================================================================
           6. COWBOY STANDART DUYURU VE MOD MOTORU
           ========================================================================== */
        function sendCowboyAnnouncement() {
            let person = document.getElementById("cowboy-person-select").value;
            let msg = document.getElementById("cowboy-msg-input").value.trim();
            
            if (msg === "") { alert("Boş duyuru yayınlanamaz."); return; }

            let formattedMessage = `${person}:(${msg})`;
            showFullScreenModal(`[YAYIN KANALI: ${person.toUpperCase()}]`, formattedMessage, 'cowboy');
            logTerm(`[GLOBAL YAYIN] ${formattedMessage}`, "cowboy");
            document.getElementById("cowboy-msg-input").value = "";
        }

        function activateCowboyMode(mode) {
            document.body.classList.remove("son-emir-active", "party-mode");
            if (mode === "guncelleme") {
                logTerm("Sistem Güncelleme Moduna Alındı. Daemonlar duraklatıldı.", "warning");
                alert("⚙️ GÜNCELLEME MODU AKTİF");
            } 
            else if (mode === "parti") {
                document.body.classList.add("party-mode");
                logTerm("🎉 Parti Modu (ISO Release) Tetiklendi!", "cowboy");
                showFullScreenModal("ISO RELEASED", "Parti Modu Devrede. Sistem sınırları kaldırıldı.", "nambow");
            } 
            else if (mode === "sonemir") {
                let onay = confirm("DİKKAT! SON EMİR PROTOKOLÜ SİSTEMİ KALICI OLARAK KİLİTLER. EMİN MİSİNİZ?");
                if(onay) {
                    document.body.classList.add("son-emir-active");
                    logTerm("☢️ KRİTİK: SON EMİR VERİLDİ. SİSTEM YIKIMI BAŞLADI.", "error");
                    localStorage.setItem("racoon_son_emir_lock", "ACTIVE");
                    setTimeout(() => { window.location.reload(); }, 3000);
                }
            }
        }

        /* ==========================================================================
           7. 10 OP (OVERPOWERED) ÖZELLİK FONKSİYONLARI (COWBOY+ BÖLÜMÜ)
           ========================================================================== */
        
        function toggleAegisFirewall() {
            opStates.aegis = !opStates.aegis;
            let aegisLayer = document.getElementById("aegis-firewall");
            let aegisBadge = document.getElementById("aegis-status-badge");
            let daemonStatus = document.getElementById("aegis-daemon-status");
            if(opStates.aegis) {
                aegisLayer.style.display = "block";
                aegisLayer.className = "aegis-shield-active";
                aegisBadge.innerText = "AEGIS: AKTİF";
                aegisBadge.style.color = "var(--aegis-shield)";
                aegisBadge.style.borderColor = "var(--aegis-shield)";
                daemonStatus.innerText = "[AKTİF]";
                daemonStatus.style.color = "var(--success)";
                logTerm("🛡️ Aegis Quantum Firewall Devrede. Ağ saldırıları bloklanıyor.", "success");
            } else {
                aegisLayer.style.display = "none";
                aegisBadge.innerText = "AEGIS: KAPALI";
                aegisBadge.style.color = "#666";
                aegisBadge.style.borderColor = "#444";
                daemonStatus.innerText = "[STANDBY]";
                daemonStatus.style.color = "#888";
                logTerm("🛡️ Aegis Firewall Kapatıldı. Sistem savunmasız.", "warning");
            }
        }

        function startTelemetryStream() {
            setInterval(() => {
                let fakeCPU = Math.floor(Math.random() * 40) + 10;
                if(opStates.hyper) fakeCPU += 50; 
                document.querySelector("#main-telemetry .telemetry-line").style.bottom = `${fakeCPU}%`;
            }, 1000);
        }

        function triggerVortexPurge() {
            document.body.classList.add("vortex-purge-active");
            logTerm("🌪️ Vortex Cache Purge başlatıldı. Bellek blokları temizleniyor...", "warning");
            setTimeout(() => {
                document.body.classList.remove("vortex-purge-active");
                logTerm("Vortex temizliği tamamlandı. 4.2GB Cache silindi.", "success");
                document.getElementById("terminal-output").innerHTML = ""; 
            }, 1500);
        }

        function toggleChronosMode() {
            opStates.chronos = !opStates.chronos;
            if(opStates.chronos) {
                document.body.classList.add("chronos-slow");
                logTerm("⏳ Chronos Time-Shift Aktif. UI animasyonları yavaşlatıldı.", "info");
            } else {
                document.body.classList.remove("chronos-slow");
                logTerm("⏳ Chronos Time-Shift Devredışı. Zaman akışı normale döndü.", "info");
            }
        }

        function toggleGhostCloak() {
            opStates.ghost = !opStates.ghost;
            if(opStates.ghost) {
                document.body.classList.add("ghost-cloaked");
                logTerm("👻 Ghost Protocol Aktif. UI izleri gizlendi.", "nambow");
            } else {
                document.body.classList.remove("ghost-cloaked");
                logTerm("👻 Ghost Protocol Devredışı.", "nambow");
            }
        }

        function triggerTitaniumScan() {
            let scanner = document.getElementById("titanium-scanner-layer");
            let logArea = document.getElementById("complex-log-area");
            scanner.style.display = "block";
            logArea.innerHTML += "<br>> Titanium Core Scan Başlatıldı...";
            logTerm("Titanium Integrity Scan devrede. Derin donanım analizi yapılıyor.", "complex");
            setTimeout(() => {
                scanner.style.display = "none";
                logArea.innerHTML += "<br>> Tarama Bitti. Z1 Extreme Çekirdeği Kusursuz.";
                logArea.scrollTop = logArea.scrollHeight;
                logTerm("Titanium Scan Tamamlandı. Zafiyet bulunamadı.", "success");
            }, 3000);
        }

        function complexDiagnostic() {
            let logArea = document.getElementById("complex-log-area");
            logTerm("COMPLEX Mantıksal Analiz Başlıyor...", "complex");
            let c = 0;
            let dInt = setInterval(() => {
                c++;
                logArea.innerHTML += `<br>> Sektör [0x00${c}F] Doğrulanıyor... OK`;
                logArea.scrollTop = logArea.scrollHeight;
                if(c > 4) {
                    clearInterval(dInt);
                    logTerm("COMPLEX: Mantıksal Bütünlük %100", "success");
                }
            }, 400);
        }

        function triggerEchoPing() {
            let echo = document.getElementById("echo-locator");
            echo.classList.remove("ping");
            void echo.offsetWidth; 
            echo.classList.add("ping");
            logTerm("📡 Echo Ping Gönderildi. Ağdaki diğer matrisler aranıyor...", "info");
        }

        function toggleHyperOverclock() {
            opStates.hyper = !opStates.hyper;
            if(opStates.hyper) {
                document.body.classList.add("hyper-overclock-active");
                logTerm("🚀 HYPER-DRIVE OVERCLOCK AKTİF! Sistem gücü %200 artırıldı. Voltaj uyarısı!", "error");
            } else {
                document.body.classList.remove("hyper-overclock-active");
                logTerm("🚀 Overclock durduruldu. Voltaj normale döndü.", "success");
            }
        }

        function triggerGenesisGlitch() {
            document.body.classList.add("genesis-glitch");
            logTerm("⚡ NEON-GENESIS GLITCH MOTORU TETİKLENDİ. GERÇEKLİK KIRILIYOR ⚡", "error");
            let glitchTexts = ["WAKE UP RACOON", "THE MATRIX IS BROKEN", "Z1 EXTREME OVERLOAD", "COWBOY OVERRIDE"];
            showFullScreenModal("FATAL GLITCH", glitchTexts[Math.floor(Math.random()*glitchTexts.length)], "cowboy");
            setTimeout(() => {
                document.body.classList.remove("genesis-glitch");
                closeFullScreenModal();
                logTerm("Glitch motoru durdu. Gerçeklik onarıldı.", "info");
            }, 2500);
        }

        /* ==========================================================================
           8. YARDIMCI VE TERMİNAL KOMUT MOTORU
           ========================================================================== */
        document.addEventListener("DOMContentLoaded", function() {
            const terminalInput = document.getElementById("terminal-input");
            
            // Eğer terminal input bulunabiliyorsa event listener ekle
            if(terminalInput) {
                terminalInput.addEventListener("keypress", function(event) {
                    if (event.key === "Enter") {
                        let command = terminalInput.value.toLowerCase().trim();
                        logTerm(`guest@racoon:~$ ${command}`, "user");
                        processCommand(command);
                        terminalInput.value = "";
                    }
                });
            }
        });

        function logTerm(msg, type) {
            const terminalOutput = document.getElementById("terminal-output");
            if(!terminalOutput) return; // Hata almamak için güvenlik kontrolü

            let div = document.createElement("div");
            div.style.marginBottom = "5px";
            div.style.fontFamily = "'Courier New', monospace";
            
            if (type === "success") div.style.color = "var(--success)";
            else if (type === "error") div.style.color = "var(--error)";
            else if (type === "warning") div.style.color = "var(--warning)";
            else if (type === "complex") div.style.color = "var(--complex-blue)";
            else if (type === "cowboy") div.style.color = "var(--cowboy-gold)";
            else if (type === "nambow") div.style.color = "var(--nambow-purple)";
            else div.style.color = "#ccc";
            
            div.innerText = `>> ${msg}`;
            terminalOutput.appendChild(div);
            terminalOutput.scrollTop = terminalOutput.scrollHeight;
        }

        function processCommand(cmd) {
            const terminalOutput = document.getElementById("terminal-output");
            if (cmd === "help") {
                logTerm("Mevcut Komutlar: clear, status, scan, cowboy-mode, lockdown, version", "info");
            } else if (cmd === "clear") {
                terminalOutput.innerHTML = "";
            } else if (cmd === "status") {
                logTerm("Sistem: OK | CPU: 12% | VFS: Mount | Firewall: " + (opStates.aegis ? "ACTIVE" : "STANDBY"), "success");
            } else if (cmd === "scan") {
                triggerTitaniumScan();
            } else if (cmd === "lockdown") {
                activateCowboyMode("sonemir");
            } else {
                logTerm(`Bilinmeyen komut: ${cmd}`, "error");
            }
        }

        function showFullScreenModal(title, body, style) {
            let modal = document.getElementById("navbow-fullscreen-modal");
            document.getElementById("modal-title").innerText = title;
            document.getElementById("modal-body-text").innerText = body;
            
            modal.className = ""; // Reset
            if (style === 'cowboy') modal.classList.add("modal-border-cowboy");
            else modal.classList.add("modal-border-nambow");
            
            modal.style.display = "flex";
        }

        function closeFullScreenModal() {
            document.getElementById("navbow-fullscreen-modal").style.display = "none";
        }

        /* ==========================================================================
           9. GERÇEK ISO İNDİRME MANTIĞI (BLOB DÖNÜŞTÜRÜCÜ)
           ========================================================================== */
        function triggerRealIsoDownload() {
            let pass = document.getElementById("iso-password").value;
            if (pass !== ISO_BUILD_KEY) {
                alert("❌ HATALI DERLEME ŞİFRESİ!");
                return;
            }

            document.getElementById("iso-progress-container").style.display = "block";
            let fill = document.getElementById("iso-progress-fill");
            let status = document.getElementById("iso-status-text");
            
            let p = 0;
            let buildInterval = setInterval(() => {
                p += 2;
                fill.style.width = p + "%";
                status.innerText = `ISO Derleniyor: %${p} - Paketler: [linux-firmware, kernel-core, filesystem-racoon]`;
                
                if (p >= 100) {
                    clearInterval(buildInterval);
                    status.innerText = "DERLEME TAMAMLANDI. BAŞLATILIYOR...";
                    
                    // Sahte indirme tetikleyici
                    const blob = new Blob(["ISO_DATA_BLOB_CONTAINING_RACCOON_OS_CORE"], {type: "application/x-iso9660-image"});
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = url;
                    a.download = "Cordex_v12_Z1_Edition.iso";
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    logTerm("ISO İndirme başlatıldı: Cordex_v12_Z1_Edition.iso", "success");
                }
            }, 100);
        }
    </script>
</body>
</html>
