<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code:Racoon OS - Complex & Architect Architecture v16.0</title>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        /* ==========================================================================
           1. KÜRESEL SİBERPUNK DEĞİŞKENLERİ VE DİKEY TASARIM TEMELLERİ
           ========================================================================== */
        :root {
            /* Renk Paleti - Code:Racoon Karakteristiği ve Yeni Seviyeler */
            --primary-orange: #ff6600;
            --dark-orange: #b34700; 
            --glow-orange: rgba(255, 102, 0, 0.8); 
            --hyper-orange: #ff4500;
            
            --matrix-color: #00ff41;
            --matrix-glow: rgba(0, 255, 65, 0.6);

            --level-cowboy: #ffd700; /* Altın */
            --level-complex: #b026ff; /* Neon Mor */
            --level-architect: #00ffff; /* Camgöbeği / Cyan */

            --neon-white: #ffffff;
            --bg-dark: #020203; 
            --panel-bg: rgba(10, 10, 15, 0.90);
            --border-color: rgba(255, 102, 0, 0.4);
            
            --font-mono: 'Courier New', Courier, monospace;
            --ui-font: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --scanline-color: rgba(255, 255, 255, 0.03);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            color: var(--neon-white);
            font-family: var(--font-mono);
            overflow: hidden;
        }

        /* ==========================================================================
           2. GELİŞMİŞ MATRİX VE CRT EFEKTLERİ
           ========================================================================== */
        #matrix-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            opacity: 0.85; /* Animasyonun belirginliği artırıldı */
        }

        .crt-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 9999;
            pointer-events: none;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                var(--scanline-color) 50%,
                var(--scanline-color)
            );
            background-size: 100% 4px;
            animation: scanlines 10s linear infinite;
        }

        @keyframes scanlines {
            0% { background-position: 0 0; }
            100% { background-position: 0 100%; }
        }

        /* ==========================================================================
           3. ARAYÜZ VE PANELLER
           ========================================================================== */
        #main-container {
            position: relative;
            z-index: 10;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px;
            backdrop-filter: blur(2px);
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 0 20px var(--glow-orange);
            border-left: 5px solid var(--primary-orange);
        }

        .brand-title {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-orange);
            text-shadow: 0 0 10px var(--glow-orange);
            letter-spacing: 2px;
        }

        .status-indicators {
            display: flex;
            gap: 20px;
        }

        .status-badge {
            padding: 5px 15px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            background: rgba(0,0,0,0.5);
        }

        #hierarchy-display {
            color: var(--primary-orange);
            font-weight: bold;
            text-transform: uppercase;
        }

        /* ==========================================================================
           4. MERKEZİ İŞLETİM ALANI (IZGARA SİSTEMİ)
           ========================================================================== */
        .core-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            flex: 1;
            height: calc(100% - 90px);
        }

        /* Terminal Paneli */
        .terminal-wrapper {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            padding: 15px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
        }

        .terminal-output {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            padding-right: 10px;
            font-size: 15px;
            line-height: 1.6;
            color: var(--neon-white);
            text-shadow: 0 0 3px rgba(255,255,255,0.4);
        }

        .terminal-output::-webkit-scrollbar { width: 8px; }
        .terminal-output::-webkit-scrollbar-thumb { background: var(--primary-orange); border-radius: 4px; }
        .terminal-output::-webkit-scrollbar-track { background: #111; }

        .terminal-input-line {
            display: flex;
            align-items: center;
            border-top: 1px dashed var(--border-color);
            padding-top: 15px;
        }

        .prompt-symbol {
            color: var(--primary-orange);
            margin-right: 10px;
            font-weight: bold;
            font-size: 18px;
        }

        #terminal-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--primary-orange);
            font-family: var(--font-mono);
            font-size: 16px;
            outline: none;
            text-shadow: 0 0 5px var(--glow-orange);
        }

        /* ==========================================================================
           5. GELİŞMİŞ YETENEKLER PANELİ (8 BUTONLU SİSTEM)
           ========================================================================== */
        .advanced-ops-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .ops-header {
            text-align: center;
            font-size: 18px;
            color: var(--primary-orange);
            border-bottom: 1px solid var(--primary-orange);
            padding-bottom: 10px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .level-section {
            display: none; /* Varsayılan olarak gizli, seviye atladıkça açılır */
            border: 1px dashed var(--border-color);
            padding: 10px;
            border-radius: 5px;
            background: rgba(0,0,0,0.4);
        }

        .level-title {
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 2px;
        }

        /* Seviye Renkleri */
        .level-cowboy .level-title { color: var(--level-cowboy); text-shadow: 0 0 8px var(--level-cowboy); }
        .level-complex .level-title { color: var(--level-complex); text-shadow: 0 0 8px var(--level-complex); }
        .level-architect .level-title { color: var(--level-architect); text-shadow: 0 0 8px var(--level-architect); }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .ops-btn {
            background: transparent;
            border: 1px solid;
            padding: 10px 5px;
            color: var(--neon-white);
            font-family: var(--font-mono);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            border-radius: 3px;
        }

        /* Buton Hover Efektleri */
        .btn-cowboy { border-color: var(--level-cowboy); color: var(--level-cowboy); }
        .btn-cowboy:hover { background: var(--level-cowboy); color: #000; box-shadow: 0 0 15px var(--level-cowboy); }

        .btn-complex { border-color: var(--level-complex); color: var(--level-complex); }
        .btn-complex:hover { background: var(--level-complex); color: #fff; box-shadow: 0 0 15px var(--level-complex); }

        .btn-architect { border-color: var(--level-architect); color: var(--level-architect); }
        .btn-architect:hover { background: var(--level-architect); color: #000; box-shadow: 0 0 15px var(--level-architect); }

        /* ==========================================================================
           6. KİLİT / SON EMİR EKRANI
           ========================================================================== */
        #lockdown-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(20, 0, 0, 0.95);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #ff0000;
            text-align: center;
        }

        .lockdown-text {
            font-size: 50px;
            font-weight: bold;
            text-shadow: 0 0 20px #ff0000;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        /* Utility Classes */
        .color-info { color: #00bfff; }
        .color-success { color: #00ff00; }
        .color-warn { color: #ffcc00; }
        .color-error { color: #ff0000; }
        .color-system { color: #ff6600; }

    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>
    <div class="crt-overlay"></div>

    <div id="lockdown-screen">
        <div class="lockdown-text">SİSTEM MÜHÜRLENDİ</div>
        <p style="margin-top:20px; font-size: 20px; color: #fff;">CODE:RACOON SON EMİR PROTOKOLÜ AKTİF</p>
    </div>

    <div id="main-container">
        
        <div class="header-bar">
            <div class="brand-title">CODE:RACOON OS // V16.0</div>
            <div class="status-indicators">
                <div class="status-badge">AĞ: GÜVENLİ</div>
                <div class="status-badge">ÇEKİRDEK: AKTİF</div>
                <div class="status-badge">SEVİYE: <span id="hierarchy-display">GUEST</span></div>
            </div>
        </div>

        <div class="core-grid">
            
            <div class="terminal-wrapper">
                <div class="terminal-output" id="terminal-output">
                    </div>
                <div class="terminal-input-line">
                    <span class="prompt-symbol">root@racoon:~#</span>
                    <input type="text" id="terminal-input" autocomplete="off" spellcheck="false" autofocus>
                </div>
            </div>

            <div class="advanced-ops-panel">
                <div class="ops-header">İLERİ DÜZEY YETENEKLER</div>
                
                <div class="level-section level-cowboy" id="panel-cowboy">
                    <div class="level-title">[ LEVEL 8: COWBOY ]</div>
                    <div class="btn-grid">
                        <button class="ops-btn btn-cowboy" onclick="execTool('net_infiltrate')">Ağ Sızma</button>
                        <button class="ops-btn btn-cowboy" onclick="execTool('crypto_decrypt')">Kripto Çözücü</button>
                    </div>
                </div>

                <div class="level-section level-complex" id="panel-complex">
                    <div class="level-title">[ LEVEL 9: COMPLEX ]</div>
                    <div class="btn-grid">
                        <button class="ops-btn btn-complex" onclick="execTool('quantum_node')">Kuantum Düğüm</button>
                        <button class="ops-btn btn-complex" onclick="execTool('neural_core')">Nöral Çekirdek</button>
                        <button class="ops-btn btn-complex" onclick="execTool('ghost_protocol')">Hayalet Modu</button>
                    </div>
                </div>

                <div class="level-section level-architect" id="panel-architect">
                    <div class="level-title">[ LEVEL 10: ARCHITECT ]</div>
                    <div class="btn-grid">
                        <button class="ops-btn btn-architect" onclick="execTool('sys_override')">Sistem Override</button>
                        <button class="ops-btn btn-architect" onclick="execTool('univ_db')">Evrensel DB</button>
                        <button class="ops-btn btn-architect" onclick="execTool('orbital_strike')">Yörünge Bağlantısı</button>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <script>
        /* ==========================================================================
           1. GELİŞMİŞ DİNAMİK MATRIX ANİMASYONU (Görsel Tarz)
           ========================================================================== */
        const canvas = document.getElementById("matrix-canvas");
        const ctx = canvas.getContext("2d");
        
        let matrixColor = "#00ff41"; // Varsayılan Hacker Yeşili
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        // Katakana, Latin ve Sayısal karakter seti
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()_+-=<>?アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレゲゼデベペオォコソトノホモヨョロゴゾドボポヴッン";
        const fontSize = 16;
        const columns = Math.floor(canvas.width / fontSize);
        const drops = Array(columns).fill(1);

        function drawMatrix() {
            // Yarı saydam siyah arka plan ile iz (trail) efekti yarat
            ctx.fillStyle = "rgba(2, 2, 3, 0.08)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = fontSize + "px monospace";
            
            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                
                // Karakterin başı parlak beyaz, gövdesi seviye rengi
                if (Math.random() > 0.95) {
                    ctx.fillStyle = "#ffffff";
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = "#ffffff";
                } else {
                    ctx.fillStyle = matrixColor;
                    ctx.shadowBlur = 5;
                    ctx.shadowColor = matrixColor;
                }

                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                ctx.shadowBlur = 0; // Performans için sıfırla

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
            requestAnimationFrame(drawMatrix);
        }
        drawMatrix();

        /* ==========================================================================
           2. SİSTEM DURUMU VE DEĞİŞKENLER
           ========================================================================== */
        let currentLevel = 1;
        let isLockedDown = localStorage.getItem("racoon_lockdown") === "true";

        const DOM = {
            terminal: document.getElementById("terminal-output"),
            input: document.getElementById("terminal-input"),
            hierarchyText: document.getElementById("hierarchy-display"),
            panelCowboy: document.getElementById("panel-cowboy"),
            panelComplex: document.getElementById("panel-complex"),
            panelArchitect: document.getElementById("panel-architect"),
            lockdownScreen: document.getElementById("lockdown-screen"),
            mainContainer: document.getElementById("main-container")
        };

        if (isLockedDown) triggerLockdown();

        /* ==========================================================================
           3. TERMINAL ÇEKİRDEK FONKSİYONLARI
           ========================================================================== */
        function logTerm(msg, type = "system", speed = 10) {
            return new Promise(resolve => {
                const line = document.createElement("div");
                let colorClass = "color-system";
                
                if(type === "info") colorClass = "color-info";
                if(type === "success") colorClass = "color-success";
                if(type === "warn") colorClass = "color-warn";
                if(type === "error") colorClass = "color-error";
                if(type === "cowboy") line.style.color = "var(--level-cowboy)";
                if(type === "complex") line.style.color = "var(--level-complex)";
                if(type === "architect") line.style.color = "var(--level-architect)";

                if (!["cowboy", "complex", "architect"].includes(type)) {
                    line.className = colorClass;
                }

                DOM.terminal.appendChild(line);
                
                let i = 0;
                function typeWriter() {
                    if (i < msg.length) {
                        line.innerHTML += msg.charAt(i);
                        i++;
                        DOM.terminal.scrollTop = DOM.terminal.scrollHeight;
                        setTimeout(typeWriter, speed);
                    } else {
                        resolve();
                    }
                }
                typeWriter();
            });
        }

        async function bootSequence() {
            DOM.input.disabled = true;
            await logTerm("CODE:RACOON OS BAŞLATILIYOR...", "system", 20);
            await logTerm("Çekirdek modülleri yükleniyor [OK]", "success", 5);
            await logTerm("Bellek adresleri tahsis ediliyor... 0x000FF [OK]", "info", 5);
            await logTerm("Güvenlik duvarı protokolleri aktif [OK]", "success", 5);
            await logTerm("Sistem mimarisi taranıyor: Legion Go Donanımı Algılandı.", "warn", 15);
            await logTerm("Bağlantı kuruldu. Komut bekleniyor.", "system", 10);
            DOM.input.disabled = false;
            DOM.input.focus();
        }

        window.onload = bootSequence;

        /* ==========================================================================
           4. GİRDİ İŞLEYİCİ (KOMUT YORUMLAYICI)
           ========================================================================== */
        DOM.input.addEventListener("keydown", async function(e) {
            if (e.key === "Enter") {
                const cmd = this.value.trim().toLowerCase();
                this.value = "";
                if (!cmd) return;

                // Echo the command
                const echo = document.createElement("div");
                echo.style.color = "var(--neon-white)";
                echo.innerHTML = `<span style="color:var(--primary-orange)">root@racoon:~#</span> ${cmd}`;
                DOM.terminal.appendChild(echo);

                DOM.input.disabled = true; // İşlem bitene kadar kilitle

                switch(cmd) {
                    case "help":
                        await logTerm("Mevcut Komutlar:", "info");
                        await logTerm("- clear     : Terminali temizler", "info", 0);
                        await logTerm("- upgrade   : Sistem seviyesini yükseltir", "info", 0);
                        await logTerm("- status    : Mevcut hiyerarşiyi gösterir", "info", 0);
                        await logTerm("- sonemir   : [TEHLİKE] Sistemi mühürler", "error", 0);
                        break;
                    
                    case "clear":
                        DOM.terminal.innerHTML = "";
                        break;

                    case "status":
                        await logTerm(`Geçerli Seviye: ${currentLevel} | Hiyerarşi: ${DOM.hierarchyText.innerText}`, "info");
                        break;

                    case "upgrade":
                        await handleUpgrade();
                        break;

                    case "sonemir":
                        await logTerm("!!! ACİL DURUM: SON EMİR TETİKLENİYOR !!!", "error", 30);
                        localStorage.setItem("racoon_lockdown", "true");
                        triggerLockdown();
                        break;

                    default:
                        await logTerm(`Komut bulunamadı: ${cmd}. 'help' yazarak listeye bakabilirsin.`, "error");
                }
                
                DOM.input.disabled = false;
                DOM.input.focus();
                DOM.terminal.scrollTop = DOM.terminal.scrollHeight;
            }
        });

        /* ==========================================================================
           5. SEVİYE SİSTEMİ (UPGRADE LOUIC)
           ========================================================================== */
        async function handleUpgrade() {
            currentLevel++;
            
            if (currentLevel === 8) {
                DOM.hierarchyText.innerText = "COWBOY";
                DOM.hierarchyText.style.color = "var(--level-cowboy)";
                matrixColor = "#ffd700"; // Altın Matrix
                DOM.panelCowboy.style.display = "block";
                await logTerm(">>> ERİŞİM ONAYLANDI: LEVEL 8 [COWBOY] KİLİDİ AÇILDI <<<", "cowboy", 20);
                await logTerm("Cowboy paneli aktif edildi. Ağ sızma yetenekleri devrede.", "info");
            } 
            else if (currentLevel === 9) {
                DOM.hierarchyText.innerText = "COMPLEX";
                DOM.hierarchyText.style.color = "var(--level-complex)";
                matrixColor = "#b026ff"; // Mor Matrix
                DOM.panelComplex.style.display = "block";
                await logTerm(">>> MİMARİ DEĞİŞİMİ: LEVEL 9 [COMPLEX] KİLİDİ AÇILDI <<<", "complex", 20);
                await logTerm("Kuantum algoritmaları ve hayalet modu devrede.", "info");
            }
            else if (currentLevel === 10) {
                DOM.hierarchyText.innerText = "ARCHITECT";
                DOM.hierarchyText.style.color = "var(--level-architect)";
                matrixColor = "#00ffff"; // Cyan Matrix
                DOM.panelArchitect.style.display = "block";
                await logTerm(">>> KÖK ERİŞİM: LEVEL 10 [ARCHITECT] KİLİDİ AÇILDI <<<", "architect", 30);
                await logTerm("Sistem tanrısı moduna geçildi. Tüm kısıtlamalar kaldırıldı.", "warn");
            }
            else if (currentLevel > 10) {
                await logTerm("Sistem zaten maksimum seviyede (ARCHITECT).", "warn");
                currentLevel = 10;
            }
            else {
                await logTerm(`Sistem güncellendi. Yeni Seviye: ${currentLevel}`, "success");
            }
        }

        /* ==========================================================================
           6. GELİŞMİŞ ARAÇLAR (8 BUTON FONKSİYONU)
           ========================================================================== */
        async function execTool(toolName) {
            DOM.input.disabled = true;
            
            switch(toolName) {
                // --- COWBOY (Level 8) ---
                case 'net_infiltrate':
                    await logTerm("[AĞ SIZMA] Başlatılıyor...", "cowboy");
                    await logTerm("Hedef IP aranıyor... Bulundu: 192.168.1.104", "info", 20);
                    await logTerm("Güvenlik duvarı bypass ediliyor [====================] 100%", "success", 10);
                    await logTerm("Veri paketleri dinleniyor. Erişim sağlandı.", "success");
                    break;
                case 'crypto_decrypt':
                    await logTerm("[KRİPTO ÇÖZÜCÜ] AES-256 şifreleme kırılıyor...", "cowboy");
                    for(let i=0; i<3; i++) await logTerm(`Deneme Hash: ${Math.random().toString(36).substring(2, 15)}`, "info", 5);
                    await logTerm("Şifre Çözüldü: 'RAC00N_RUL3Z_2026'", "success");
                    break;

                // --- COMPLEX (Level 9) ---
                case 'quantum_node':
                    await logTerm("[KUANTUM DÜĞÜM] Analiz başlatıldı.", "complex");
                    await logTerm("Süperpozisyon durumları hesaplanıyor...", "info", 30);
                    await logTerm("Düğüm eşleşmesi başarılı. Olasılık sapması: %0.003", "success");
                    break;
                case 'neural_core':
                    await logTerm("[NÖRAL ÇEKİRDEK] Sinir ağları eğitiliyor...", "complex");
                    await logTerm("Epoch 1/500... Kayıp: 0.84", "info", 5);
                    await logTerm("Epoch 500/500... Kayıp: 0.01", "info", 5);
                    await logTerm("Model başarıyla yüklendi. Otonom karar alma devrede.", "success");
                    break;
                case 'ghost_protocol':
                    await logTerm("[HAYALET MODU] Dijital ayak izi siliniyor...", "complex");
                    await logTerm("Log kayıtları: TEMİZLENDİ", "success");
                    await logTerm("MAC Adresi: SIFIRLANDI", "success");
                    await logTerm("Görünmezlik kalkanı aktif.", "warn");
                    break;

                // --- ARCHITECT (Level 10) ---
                case 'sys_override':
                    await logTerm("[SİSTEM OVERRIDE] Ana kart çekirdeğine doğrudan erişim...", "architect", 40);
                    await logTerm("Legion Go termal limitleri kaldırılıyor...", "warn");
                    await logTerm("CPU Saat hızı: +15%", "success");
                    await logTerm("Override Tamamlandı.", "info");
                    break;
                case 'univ_db':
                    await logTerm("[EVRENSEL DB] Global sunuculara ping atılıyor...", "architect");
                    await logTerm("Kıtalararası veritabanı senkronizasyonu [OK]", "success");
                    await logTerm("Tüm arşivlere okuma/yazma izni verildi.", "warn");
                    break;
                case 'orbital_strike':
                    await logTerm("[YÖRÜNGE BAĞLANTISI] Uydu sinyali aranıyor...", "architect", 30);
                    await logTerm("GEO-Stat uydusu ile el sıkışıldı. Gecikme: 12ms", "info");
                    await logTerm("Global izleme ağı ekranınıza aktarıldı.", "success");
                    break;
            }
            
            DOM.input.disabled = false;
            DOM.input.focus();
        }

        /* ==========================================================================

           ========================================================================== */

            DOM.mainContainer.style.display = "none";
            DOM.lockdownScreen.style.display = "flex";

        }

    </script>
