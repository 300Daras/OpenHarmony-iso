<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cordex OS Gelişmiş Dağıtım</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: linear-gradient(rgba(13, 17, 23, 0.85), rgba(13, 17, 23, 0.85)), 
                        url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1920') no-repeat center center fixed;
            background-size: cover;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Giriş ve Panel Kutusu */
        .login-container {
            border: 3px solid #00ffcc;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
            background-color: rgba(22, 27, 34, 0.95);
            padding: 35px;
            border-radius: 16px;
            width: 720px; 
            max-height: 90vh; /* Ekran boyutuna göre kendini sınırlar */
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            backdrop-filter: blur(8px);
            position: relative;
        }

        /* İçeriğin kutu içinde taşmasını önleyen ve gerekirse kaydıran gövde */
        .panel-body {
            overflow-y: auto;
            padding-right: 10px;
            flex-grow: 1;
        }

        /* İnce ve şık kaydırma çubuğu tasarımı */
        .panel-body::-webkit-scrollbar, .readonly-notes::-webkit-scrollbar, textarea::-webkit-scrollbar {
            width: 8px;
        }
        .panel-body::-webkit-scrollbar-track, .readonly-notes::-webkit-scrollbar-track, textarea::-webkit-scrollbar-track {
            background: #0d1117;
            border-radius: 4px;
        }
        .panel-body::-webkit-scrollbar-thumb, .readonly-notes::-webkit-scrollbar-thumb, textarea::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }
        .panel-body::-webkit-scrollbar-thumb:hover, .readonly-notes::-webkit-scrollbar-thumb:hover, textarea::-webkit-scrollbar-thumb:hover {
            background: #00ffcc;
        }

        h1 {
            color: #00ffcc;
            font-size: 30px;
            margin-top: 0;
            margin-bottom: 25px;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
            text-align: center;
        }

        h2 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-top: 25px;
            margin-bottom: 15px;
            padding-bottom: 8px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="password"], input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            background-color: #0d1117;
            border: 2px solid #30363d;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            border-color: #00ffcc;
            outline: none;
            box-shadow: 0 0 10px #00ffcc;
        }

        button {
            background-color: #00ffcc;
            color: #0d1117;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
            transition: 0.3s;
            width: 100%;
        }

        button:hover {
            background-color: #00cc99;
            box-shadow: 0 0 25px #00cc99;
            transform: translateY(-2px);
        }

        .dev-btn-style {
            background-color: transparent;
            color: #ff9900;
            border: 2px solid #ff9900;
            margin-top: 15px;
            box-shadow: 0 0 10px rgba(255, 153, 0, 0.2);
        }

        .dev-btn-style:hover {
            background-color: #ff9900;
            color: #0d1117;
            box-shadow: 0 0 20px #ff9900;
        }

        .dev-login-box {
            display: none;
            margin-top: 15px;
            border-top: 2px dashed #ff9900;
            padding-top: 20px;
        }

        .panel-screen {
            display: none;
            text-align: left;
        }

        .progress-container {
            background-color: #0d1117;
            border-radius: 8px;
            border: 1px solid #30363d;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar {
            background-color: #00ffcc;
            height: 25px;
            width: 51%; 
            text-align: center;
            line-height: 25px;
            color: #0d1117;
            font-weight: bold;
            transition: width 0.4s ease;
            box-shadow: 0 0 10px #00ffcc;
        }

        /* Kaydırılabilir Salt Okunur Not Alanı (Hata Çözümü) */
        .readonly-notes {
            background-color: #0d1117;
            border: 2px solid #30363d;
            border-radius: 8px;
            padding: 15px;
            height: 220px; /* Sabit yükseklik */
            overflow-y: auto; /* Dikey kaydırma aktif */
            white-space: pre-wrap;
            font-family: monospace;
            color: #fff;
            font-size: 14px;
            line-height: 1.5;
        }

        .range-slider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .range-slider input {
            flex: 1;
            height: 10px;
            cursor: pointer;
        }

        /* Ayrılmış Özel Yönetim Bölümleri İçin Çerçeve */
        .dev-sub-section {
            border: 1px dashed #30363d;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            background-color: rgba(13, 17, 23, 0.4);
        }
    </style>
</head>
<body>

    <div class="login-container" id="loginBox">
        <h1>CORDEX OS KERNEL</h1>
        
        <div id="standardLoginSection">
            <p style="color: #8b949e; font-size: 18px; text-align: center;">Sisteme erişmek için şifrenizi giriniz:</p>
            <div class="input-group">
                <input type="password" id="sitePassword" placeholder="Kullanıcı Giriş Şifresi">
            </div>
            <button onclick="kullaniciGirisYap()">Sisteme Giriş Yap</button>
            
            <button onclick="devGirisiniAc()" class="dev-btn-style">signing by developer</button>
        </div>

        <div class="dev-login-box" id="devLoginBox">
            <p style="color: #ff9900; font-weight: bold; font-size: 18px; text-align: center;">DEVELOPER KİMLİK DOĞRULAMA</p>
            <div class="input-group">
                <input type="password" id="devPassword" placeholder="Geliştirici Admin Şifresini Girin">
            </div>
            <button onclick="developerGirisiniKontrolEt()" style="background-color: #ff9900; box-shadow: 0 0 15px #ff9900; color: #fff;">Doğrula ve Giriş Yap</button>
            <button onclick="devGirisiniKapat()" style="background-color: #da3637; border: none; box-shadow: 0 0 10px #da3637; color: #fff; margin-top: 10px; padding: 10px; font-size: 14px; width: 100%;">İptal Et</button>
        </div>
    </div>

    <div class="login-container panel-screen" id="userPanel">
        <h2 style="color: #00ffcc; border-bottom: 2px solid #00ffcc; padding-bottom: 15px;">📊 CORDEX OS SİSTEM DURUMU</h2>
        
        <div class="panel-body">
            <div class="input-group">
                <label style="color: #c9d1d9;">Cordex OS Geliştirilme Yüzdesi:</label>
                <div class="progress-container">
                    <div class="progress-bar" id="userProgressBar">%51</div>
                </div>
            </div>

            <div class="input-group">
                <label style="color: #c9d1d9;">Aktif Sürüm Notları:</label>
                <div class="readonly-notes" id="userVersionNotesView">Yükleniyor...</div>
            </div>
        </div>

        <button onclick="panellerdenCikisYap()" style="background-color: #da3637; box-shadow: 0 0 15px #da3637; color: #fff; margin-top: 15px;">Sistemden Çıkış Yap</button>
    </div>

    <div class="login-container panel-screen" id="devPanel">
        <h2 style="color: #ff9900; border-bottom: 2px solid #ff9900; padding-bottom: 15px;">🛠️ DEVELOPER MODE PANEL</h2>
        
        <div class="panel-body">
            <div class="dev-sub-section">
                <div class="section-title" style="color: #ff9900; margin-top: 0;">📈 Gelişim Durumu</div>
                <div class="input-group">
                    <label>Geliştirilme Yüzdesini Ayarla:</label>
                    <div class="range-slider">
                        <input type="range" id="devPercent" min="0" max="100" value="51" oninput="yuzdeGuncelle(this.value)">
                        <span id="percentText" style="font-weight: bold; color: #00ffcc; font-size: 20px;">%51</span>
                    </div>
                </div>
            </div>

            <div class="dev-sub-section">
                <div class="section-title" style="color: #ff9900; margin-top: 0;">📝 Dokümantasyon</div>
                <div class="input-group">
                    <label>Sürüm Notlarını Düzenle ve Yayınla:</label>
                    <textarea id="versionNotes" rows="6" style="font-size: 14px; font-family: monospace;"></textarea>
                    <button onclick="notlariKaydet()" style="background-color: #238636; box-shadow: 0 0 10px #238636; color: #fff; margin-top: 10px; padding: 10px; font-size: 15px;">Sürüm Notlarını Güncelle</button>
                </div>
            </div>

            <div class="dev-sub-section" style="border-color: #ff9900;">
                <div class="section-title" style="color: #ff9900; margin-top: 0;">🔐 DEVELOPER ŞİFRE YÖNETİM MERKEZİ</div>
                
                <div class="input-group" style="margin-bottom: 15px;">
                    <label style="font-size: 14px; color: #8b949e;">Standart Kullanıcı Şifresini Sıfırla:</label>
                    <input type="text" id="resetUserPasswordInput" placeholder="Yeni Standart Kullanıcı Şifresi">
                    <button onclick="userSifresiniResetle()" style="background-color: #ff9900; color: #0d1117; margin-top: 8px; padding: 8px; font-size: 14px;">Kullanıcı Şifresini Resetle</button>
                </div>

                <div class="input-group" style="margin-bottom: 5px;">
                    <label style="font-size: 14px; color: #8b949e;">Admin / Developer Şifresini Sıfırla:</label>
                    <input type="text" id="resetAdminPasswordInput" placeholder="Yeni Admin/Developer Şifresi">
                    <button onclick="adminSifresiniResetle()" style="background-color: #da3637; color: #fff; margin-top: 8px; padding: 8px; font-size: 14px; box-shadow: 0 0 10px rgba(218,54,55,0.3);">Admin Şifresini Resetle</button>
                </div>
            </div>
        </div>

        <button onclick="panellerdenCikisYap()" style="background-color: #da3637; box-shadow: 0 0 15px #da3637; color: #fff; margin-top: 15px;">Paneli Kapat / Çıkış Yap</button>
    </div>

    <script>
        // Başlangıç Sistem Şifreleri
        let aktifKullaniciSifresi = "CordexxElo/StandartUser";
        let aktifAdminSifresi = "DaghanCordexxElo2024";

        let guncelYuzde = "51";
        let guncelNotlar = "Cordex OS - Geliştirme Notları\n\nŞu ana kadar web sitesi projesinde yapılan tüm güncellemeler ve eklenen özellikler:\n\n- Büyük ve Geniş Arayüz Tasarımı: Giriş paneli kutusu 680 piksele genişletilerek daha ferah ve siber temaya uygun, parlayan neon çerçeveli bir yapıya kavuşturuldu.\n- Teknolojik Arka Plan: Sitenin arka planına karanlık, şık ve siber temalı bir teknoloji görseli eklendi; üzerine çekilen şeffaf katmanla yazıların okunabilirliği artırıldı.\n- Gelişmiş CSS Yerleşimi: Giriş panelinin ekranın tam ortasında (dikey ve yatay olarak) sabit durması sağlandı, sayfanın aşağı kayması engellendi.\n- \"signing by developer\" Butonu: Geliştirici girişi alanı gizli olmaktan çıkarılıp ana ekranda parlayan neon turuncu renkli bir buton haline getirildi.\n- Çok Katmanlı Rol/Şifre Sistemi:\n  * Standart Kullanıcı Girişi: CordexxElo/StandartUser şifresiyle sisteme sadece izleyici (Salt Okunur) olarak giriş imkanı.\n  * Admin / Geliştirici Girişi: DaghanCordexxElo2024 şifresiyle sistemi yönetebilen tam yetkili tek hesap.\n- Sistem Durumu İzleme Ekranı (Herkese Açık / Salt Okunur): Standart kullanıcıların ve ziyaretçilerin projenin tamamlanma yüzdesini (neon ilerleme çubuğu ile) ve sürüm notlarını anlık görebileceği ama üzerinde hiçbir değişiklik yapamayacağı kilitli ekran yapıldı.\n- Canlı Developer Paneli (Sadece Sana Özel): Geliştirici girişi yapıldığında açılan; tamamlanma yüzdesini fareyle kaydırarak değiştirebileceğin, sürüm notlarını yazıp güncelleyebileceğin ve admin şifresini değiştirebileceğin dinamik yönetim ekranı entegre edildi.\n- JavaScript Çakışma ve Donma Çözümü: Geliştirici girişi butonundaki fonksiyon ismi çakışması (developerGirisiniKontrolEt) düzeltilerek tarayıcının kilitlenmesi/donması tamamen engellendi.";

        window.onload = function() {
            document.getElementById("versionNotes").value = guncelNotlar;
            document.getElementById("userVersionNotesView").innerText = guncelNotlar;
        };

        function kullaniciGirisYap() {
            const girilenSifre = document.getElementById("sitePassword").value;
            if (girilenSifre === aktifKullaniciSifresi) {
                alert("Kullanıcı Girişi Başarılı! Sistem Bilgileri Getiriliyor...");
                
                document.getElementById("userProgressBar").style.width = guncelYuzde + "%";
                document.getElementById("userProgressBar").innerText = "%" + guncelYuzde;
                document.getElementById("userVersionNotesView").innerText = guncelNotlar;

                document.getElementById("loginBox").style.display = "none";
                document.getElementById("userPanel").style.display = "flex";
            } else {
                alert("Hatalı Kullanıcı Şifresi!");
            }
        }

        function devGirisiniAc() {
            document.getElementById("standardLoginSection").style.display = "none";
            document.getElementById("devLoginBox").style.display = "block";
        }

        function devGirisiniKapat() {
            document.getElementById("devLoginBox").style.display = "none";
            document.getElementById("standardLoginSection").style.display = "block";
            document.getElementById("devPassword").value = "";
        }

        function developerGirisiniKontrolEt() {
            const girilenDevSifre = document.getElementById("devPassword").value;
            if (girilenDevSifre === aktifAdminSifresi) {
                alert("Yönetici Kimliği Doğrulandı! Geliştirici Değişiklik Paneli Açılıyor...");
                document.getElementById("loginBox").style.display = "none";
                document.getElementById("devPanel").style.display = "flex";
            } else {
                alert("Yetkisiz Geliştirici Şifresi! Erişim Reddedildi.");
            }
        }

        function yuzdeGuncelle(val) {
            document.getElementById("percentText").innerText = "%" + val;
            guncelYuzde = val; 
        }

        function userSifresiniResetle() {
            const yeniSifre = document.getElementById("resetUserPasswordInput").value;
            if(yeniSifre.trim() !== "") {
                aktifKullaniciSifresi = yeniSifre;
                alert("Başarılı! Standart Kullanıcı Giriş Şifresi Sıfırlandı: " + yeniSifre);
                document.getElementById("resetUserPasswordInput").value = "";
            } else {
                alert("Lütfen geçerli bir kullanıcı şifresi yazın!");
            }
        }

        // Admin Kendi Şifresini Sıfırlama Fonksiyonu
        function adminSifresiniResetle() {
            const yeniSifre = document.getElementById("resetAdminPasswordInput").value;
            if(yeniSifre.trim() !== "") {
                aktifAdminSifresi = yeniSifre;
                alert("Başarılı! Admin/Developer Giriş Şifresi Sıfırlandı: " + yeniSifre);
                document.getElementById("resetAdminPasswordInput").value = "";
            } else {
                alert("Lütfen geçerli bir admin şifresi yazın!");
            }
        }

        function notlariKaydet() {
            const yeniNotlar = document.getElementById("versionNotes").value;
            guncelNotlar = yeniNotlar; 
            alert("Sürüm Notları Sistem Belleğinde Başarıyla Güncellendi!");
        }

        function panellerdenCikisYap() {
            document.getElementById("devPanel").style.display = "none";
            document.getElementById("userPanel").style.display = "none";
            document.getElementById("loginBox").style.display = "block";
            devGirisiniKapat();
            document.getElementById("sitePassword").value = "";
        }
    </script>
</body>
</html>
