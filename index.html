<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cordex OS / NET OpenHarmony Terminal</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        
        html, body {
            margin: 0; padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Sayfa kaydırmayı engelle */
        }

        body {
            /* Arka plan görsel yolu ve tam ekran ayarları */
            background-image: url('ArkaPlan/arkaplan.jpg.png') !important;
            background-repeat: no-repeat !important;
            background-position: center center !important;
            /* Fotonun ekrana tam oturmasını ve küçülmesini sağlayan kilit ayar */
            background-size: cover !important; 
            background-attachment: fixed !important;
            background-color: #02040a; 
            font-family: 'Courier New', Courier, monospace;
            color: #00ff66;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Küçültülmüş ve Yarı Saydam CMD Penceresi */
        .terminal-window {
            /* Terminal boyutlarını isteğin üzerine küçülttük */
            width: 80%; /* Genişlik %90'dan %80'e düştü */
            max-width: 650px; /* Maksimum genişlik 850px'den 650px'e düştü */
            height: 60vh; /* Yükseklik %80'den %60'a düştü */
            
            background: rgba(10, 15, 28, 0.88);
            border: 2px solid #00e5ff;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.25);
            border-radius: 8px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            
            /* Terminal penceresini hafifçe yukarı aldık */
            transform: translateY(-5%); 
        }

        .terminal-header {
            background: rgba(0, 229, 255, 0.15);
            padding: 10px; /* Padding biraz azaldı */
            border-bottom: 1px solid #00e5ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #00e5ff;
            font-size: 10pt; /* Font boyutu biraz küçüldü */
            font-weight: bold;
        }

        .window-dots span {
            display: inline-block;
            width: 10px; height: 10px; /* Noktalar küçüldü */
            border-radius: 50%; margin-left: 5px;
        }

        .terminal-body {
            padding: 15px; /* Padding azaldı */
            flex: 1;
            overflow-y: auto;
            font-size: 10pt; /* Yazılar biraz küçüldü */
            line-height: 1.5;
        }

        .output-line { margin-bottom: 6px; white-space: pre-wrap; }
        .system-msg { color: #00e5ff; }
        .error-msg { color: #ff0055; font-weight: bold; }
        .success-msg { color: #00ff66; }
        .root-msg { color: #ff0055; }
        .admin-msg { color: #ff9900; }

        .input-line {
            display: flex;
            padding: 10px 15px; /* Padding azaldı */
            background: rgba(0, 0, 0, 0.5);
            border-top: 1px solid rgba(0, 229, 255, 0.2);
            align-items: center;
        }

        .prompt {
            color: #00e5ff;
            margin-right: 8px;
            font-weight: bold;
            white-space: nowrap;
        }

        #cmd-input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-family: inherit;
            font-size: 11pt; /* Giriş yazısı biraz küçüldü */
            width: 100%;
            outline: none;
        }
    </style>
</head>
