<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Cordex OS / NET Terminal</title>
    <style>
        /* CSS RESET VE GENEL AYARLAR */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: url('ArkaPlan/arkaplan.jpg.png') fixed no-repeat center/cover; 
            background-color: #02040a; /* Resim yüklenmezse yedek renk */
            font-family: 'Courier New', monospace; 
            color: #00ff66; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; overflow: hidden;
        }
        
        /* TERMİNAL PENCERESİ */
        .terminal-window { 
            width: 60%; max-width: 650px; height: 60vh; 
            background: rgba(10, 15, 28, 0.9); 
            border: 2px solid #00e5ff; border-radius: 8px; 
            display: flex; flex-direction: column; 
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
        }
        
        /* MAVİ EKRAN (WIZARD) STİLİ */
        .blue-mode { 
            background: #0078d7 !important; 
            color: white !important; 
            border-color: white !important;
            animation: pulse 2s infinite; 
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.95; } }
        
        /* İÇERİK ALANLARI */
        .terminal-body { padding: 15px; flex: 1; overflow-y: auto; line-height: 1.4; }
        .input-line { display: flex; padding: 10px; background: rgba(0,0,0,0.5); border-top: 1px solid rgba(0,229,255,0.3); }
        #cmd-input { background: none; border: none; color: white; width: 100%; outline: none; font-family: inherit; font-size: 10pt; }
        #prompt { margin-right: 8px; font-weight: bold; white-space: nowrap; }

        /* MESAJ RENKLENDİRMELERİ */
        .output-line { margin-bottom: 5px; white-space: pre-wrap; }
        .error-msg { color: #ff3333; font-weight: bold; }
        .success-msg { color: #00ff66; font-weight: bold; }
        .system-msg { color: #00e5ff; }
        .warning-msg { color: #ffcc00; }
    </style>
</head>
<body>
    <div class="terminal-window" id="terminal-window">
        <div class="terminal-body" id="terminal-history">
            <div class="system-msg">*** CORDEX KERNEL ENJEKSİYON MERKEZİ ***</div>
            <div class="system-msg">Sistem hazır. Komutlar: config, lock, publish, clear, help</div>
        </div>
        <div class="input-line">
            <span id="prompt">guest@cordex:~$ </span>
            <input type="text" id="cmd-input" autofocus autocomplete="off">
        </div>
    </div>

    <script>
        // SİSTEM DURUMU (STATE)
        let state = { 
            isLocked: false, 
            isPublishing: false, // Spam koruması için
            step: 0, 
            config: { lang: "", country: "", purpose: "", touch: "", isoName: "", fs: "", isSaved: false }
        };

        const history = document.getElementById("terminal-history");
        const cmdInput = document.getElementById("cmd-input");
        const promptSpan = document.getElementById("prompt");
        const windowEl = document.getElementById("terminal-window");

        // EKRANA YAZDIRMA FONKSİYONU
        function print(msg, typeClass = "output-line") {
            const div = document.createElement("div");
            div.className = "output-line " + typeClass;
            div.textContent = msg;
            history.appendChild(div);
            history.scrollTop = history.scrollHeight;
        }

        // KURULUM MENÜSÜ GÖSTERİCİ
        function showMenu() {
            if (state.step === 1) print("\n1) Dil / Language: TR / EN", "system-msg");
            else if (state.step === 2) print("\n2) Ülke / Country: Turkey / USA", "system-msg");
            else if (state.step === 3) print("\n3) Kullanım Amacı / Purpose: Work / Gaming", "system-msg");
            else if (state.step === 4) print("\n4) Dokunmatik mi / Touchscreen: Yes / No", "system-msg");
            else if (state.step === 5) print("\n5) İsonun Adı / ISO Name: (Yazınız)", "system-msg");
            else if (state.step === 6) print("\n6) Dosya Sistemi / File System: EXT4 / BTRFS", "system-msg");
        }

        // KOMUT DİNLEYİCİ
        cmdInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                const rawCmd = cmdInput.value.trim();
                cmdInput.value = "";
                
                // 1. BOŞ KOMUT KORUMASI
                if (!rawCmd) return; 

                // Kullanıcının yazdığını ekrana bas
                print(promptSpan.textContent + rawCmd);

                const cmdLower = rawCmd.toLowerCase();

                // 2. KİLİT KORUMASI
                if (state.isLocked && cmdLower !== "unlock") {
                    print("HATA: SİSTEM KİLİTLİ! İşlem yapmak için 'unlock' yazın.", "error-msg");
                    return;
                }

                // 3. KOMUT İŞLEYİCİ
                if (cmdLower === "lock") {
                    state.isLocked = true;
                    state.step = 0; // Eğer menüdeyken kilitlendiyse menüyü sıfırla
                    windowEl.classList.remove('blue-mode');
                    promptSpan.style.color = "#ff3333"; // Kilitliyken imleç kırmızı olur
                    print("SİSTEM KİLİTLENDİ. Tüm yetkiler askıya alındı.", "error-msg");
                } 
                else if (cmdLower === "unlock") {
                    if (!state.isLocked) {
                        print("Sistem zaten açık.", "warning-msg");
                        return;
                    }
                    state.isLocked = false;
                    promptSpan.style.color = ""; // İmleç rengi normale döner
                    print("Sistem kilidi açıldı. Yetkiler geri yüklendi.", "success-msg");
                } 
                else if (cmdLower === "clear") {
                    history.innerHTML = "";
                }
                else if (cmdLower === "help") {
                    print("Kullanılabilir Komutlar: config, lock, unlock, publish, clear, help", "system-msg");
                }
                else if (cmdLower === "publish") {
                    // 4. SPAM KORUMASI
                    if (state.isPublishing) {
                        print("HATA: Şu anda zaten bir yayınlama işlemi devam ediyor!", "error-msg");
                        return;
                    }
                    
                    state.isPublishing = true;
                    let count = 5;
                    print("ISO yayınlama protokolü başlatıldı... Geri sayım:", "warning-msg");
                    
                    let timer = setInterval(() => {
                        if (count > 0) {
                            print(count + "...");
                        } else {
                            clearInterval(timer);
                            print("BAŞARILI: CordexOS.iso global ağda yayında!", "success-msg");
                            state.isPublishing = false; // İşlem bitince kilidi aç
                        }
                        count--;
                    }, 1000);
                } 
                // 5. CONFIG WIZARD ENTEGRASYONU
                else if (cmdLower === "config") {
                    windowEl.classList.add('blue-mode');
                    state.step = 1;
                    print("=== CORDEX OS ARCH-INSTALLER ===", "system-msg");
                    showMenu();
                } 
                else if (state.step > 0) {
                    // Mavi ekran (Wizard) aktifken girilen yanıtlar
                    if (state.step === 1) { state.config.lang = rawCmd; state.step++; showMenu(); }
                    else if (state.step === 2) { state.config.country = rawCmd; state.step++; showMenu(); }
                    else if (state.step === 3) { state.config.purpose = rawCmd; state.step++; showMenu(); }
                    else if (state.step === 4) { state.config.touch = rawCmd; state.step++; showMenu(); }
                    else if (state.step === 5) { state.config.isoName = rawCmd; state.step++; showMenu(); }
                    else if (state.step === 6) { 
                        state.config.fs = rawCmd; 
                        state.step = 0; 
                        print("\nVeriler alındı. Seçenekler: 'save and install', 'save and exit', 'don't save and exit'", "warning-msg");
                    }
                } 
                else if (cmdLower === "save and install") {
                    state.config.isSaved = true;
                    windowEl.classList.remove('blue-mode');
                    print("Sistem Yapılandırılıyor...", "system-msg");
                    print(`ISO (${state.config.isoName || "CordexDefault"}) oluşturuldu. Kurulum tamamlandı!`, "success-msg");
                } 
                else if (cmdLower === "save and exit") {
                    state.config.isSaved = true;
                    windowEl.classList.remove('blue-mode');
                    print("Ayarlar diske yazıldı ve menüden çıkıldı.", "success-msg");
                } 
                else if (cmdLower === "don't save and exit") {
                    windowEl.classList.remove('blue-mode');
                    print("İşlem iptal edildi. Değişiklikler silindi.", "error-msg");
                } 
                else {
                    print(`HATA: '${rawCmd}' komutu bulunamadı. Destek için 'help' yazın.`, "error-msg");
                }
            }
        });
    </script>
</body>
</html>
