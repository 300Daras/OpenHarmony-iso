<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code:Racoon</title>
    <style>
        /* Code:Racoon Karanlık Tema Tasarımı */
        body {
            background-color: #1e1e1e;
            color: #f8f8f2;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
        }

        .brand {
            font-size: 26px;
            font-weight: bold;
            color: #50fa7b; /* Canlı yeşil tonu */
        }

        .status-indicator {
            padding: 5px 10px;
            background: #44475a;
            border-radius: 4px;
            font-size: 14px;
        }

        /* Durduruldu Bildirimi */
        .alert-banner {
            background-color: #ff5555;
            color: #ffffff;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            border-radius: 5px;
            margin: 20px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* Kod Yazma Alanı (Her zaman aktif) */
        .editor-section {
            margin-top: 20px;
        }

        .editor-section h3 {
            color: #8be9fd;
        }

        textarea {
            width: 100%;
            height: 250px;
            background-color: #282a36;
            color: #f8f8f2;
            border: 1px solid #6272a4;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            border-radius: 6px;
            box-sizing: border-box;
            resize: vertical;
        }

        /* Eski Ekranda Açılacak Olan Tam Yetkili Guest Paneli */
        .old-guest-panel {
            display: none; /* Başlangıçta gizli */
            margin-top: 25px;
            padding: 20px;
            background-color: #2b2b36;
            border-left: 5px solid #50fa7b;
            border-radius: 4px;
        }

        .old-guest-panel h2 {
            color: #50fa7b;
            margin-top: 0;
        }

        /* Root Kontrol Alanı */
        .root-control {
            margin-top: 30px;
            padding: 15px;
            background: #21222c;
            border-radius: 6px;
            border: 1px dashed #6272a4;
        }

        input[type="password"] {
            background: #282a36;
            color: #fff;
            border: 1px solid #444;
            padding: 8px;
            font-family: monospace;
            border-radius: 4px;
        }

        button {
            background: #50fa7b;
            color: #282a36;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            font-family: monospace;
        }

        button:hover {
            background: #8be9fd;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">Code:Racoon</div>
        <div id="system-status" class="status-indicator">Sistem: Kısıtlı Mod</div>
    </header>

    <div id="maintenance-notice" class="alert-banner">
        ⚠️ PROJE GEÇİCİ OLARAK DURDURULDU
    </div>

    <div class="editor-section">
        <h3>[SandBox] Kodlama Ekranı</h3>
        <textarea placeholder="// Proje durdurulsa bile buraya geçici kodlarını yazıp test edebilirsin..."></textarea>
    </div>

    <div id="legacy-guest-ui" class="old-guest-panel">
        <h2>🚀 Eski Guest Modu (Tam Yetki)</h2>
        <p>Sistem uyandırıldı. Şu an guest kullanıcısı her türlü kernel tetiklemesini ve dosya modifikasyonunu yapabilir.</p>
        <hr style="border-color: #444;">
        <button onclick="alert('Çekirdek derleniyor...')">Kernel Tetikle</button>
        <button onclick="alert('Tüm dosya izinleri açıldı!')">Guest Bypass Modunu Aç</button>
    </div>

    <div class="root-control">
        <label for="root-pass">Geri Döndürme Komutu (Root): </label>
        <input type="password" id="root-pass" placeholder="root anahtarını girin">
        <button onclick="authRoot()">Sistemi Geri Döndür</button>
    </div>

    <script>
        // Root kontrol mekanizması
        function authRoot() {
            const inputVal = document.getElementById('root-pass').value;

            // Anahtar kelime 'root' olarak belirlendi
            if (inputVal.trim() === "root") {
                // 1. Durduruldu bildirimini gizle
                document.getElementById('maintenance-notice').style.display = 'none';
                
                // 2. Eski tam yetkili guest ekranını görünür yap
                document.getElementById('legacy-guest-ui').style.display = 'block';
                
                // 3. Sistem durumunu güncelle
                const status = document.getElementById('system-status');
                status.innerText = "Sistem: Root (Geri Döndürüldü)";
                status.style.backgroundColor = "#50fa7b";
                status.style.color = "#282a36";
                
                alert("Root erişimi onaylandı! Eski guest sistemi başarıyla geri yüklendi.");
            } else {
                alert("Hatalı Root Yetkilendirmesi! Erişim engellendi.");
            }
        }
    </script>

</body>
</html>
